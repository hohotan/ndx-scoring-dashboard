name: Refresh NDX data

# NOTE: The dashboard data source is now Wind (万得), which requires a local Wind
# terminal and cannot run in GitHub Actions CI. This workflow therefore:
#   - does NOT auto-run on push or on a daily cron (that would regenerate with the
#     legacy yfinance pipeline and overwrite the Wind-sourced data);
#   - only runs on manual `workflow_dispatch`. Even then it calls build_wind_data.py,
#     which no-ops in CI (no Wind source files) so it never clobbers the deployed data.
# To refresh the live site, run build_wind_data.py locally (with the Wind terminal up)
# and push the generated files.

on:
  # 允许在 Actions 页面手动触发（CI 下为 no-op，不会覆盖 Wind 数据）
  workflow_dispatch:

permissions:
  contents: write   # 仅手动触发时可能写回 index.html / ndx_*.json

concurrency:
  group: ndx-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Build from Wind data (no-op in CI without Wind source files)
        run: python build_wind_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html ndx_history.json ndx_snapshot.json echarts.min.js
          if git diff --staged --quiet; then
            echo "No data change (Wind source files absent in CI), skip commit"
          else
            git commit -m "chore: NDX score refresh via Wind [skip ci]"
            git push
          fi
