name: Refresh NDX data

on:
  # 首次 push 或手动 push 到 main 时立即跑一次（自动拉取 echarts + 生成 index.html）
  push:
    branches: [main]
  schedule:
    # 09:00 北京时间 = 01:00 UTC，每日自动刷新
    - cron: '0 1 * * *'
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

permissions:
  contents: write   # 需要写回 index.html / ndx_*.json / echarts.min.js

concurrency:
  group: ndx-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy

      - name: Fetch & score data
        run: python fetch_data.py

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html ndx_history.json ndx_snapshot.json echarts.min.js
          if git diff --staged --quiet; then
            echo "No data change, skip commit"
          else
            git commit -m "chore: daily NDX score refresh [skip ci]"
            git push
          fi
